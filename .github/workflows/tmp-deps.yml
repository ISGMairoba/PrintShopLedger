name: Temporary install
on:
  push:
    branches: ['claude/tailwind']
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[deps]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-dev --save-exact tailwindcss@4.1.11 @tailwindcss/vite@4.1.11 --no-audit --no-fund
      - run: npm run build && node scripts/check-tailwind.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Add Tailwind 4.1.11 [deps] [formatted]" || true
          git push
