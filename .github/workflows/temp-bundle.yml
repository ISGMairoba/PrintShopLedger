name: TEMP bundle
on:
  push:
    branches: ['claude/history-window-stage2']
permissions:
  contents: write
jobs:
  bundle:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes esbuild@0.25.10 supabase/functions/ledger-window/index.ts --bundle --format=esm --platform=neutral --target=es2022 --minify --external:npm:* --outfile=bundle/index.js
      - run: ls -la bundle && node -e "import('./bundle/index.js').catch(e=>console.log('import (expected Deno-only):', e.message.slice(0,120)))"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp bundle/index.js /tmp/ledger-window.js
          git fetch origin
          git switch --orphan claude/bundle-out
          git rm -rf --quiet . || true
          cp /tmp/ledger-window.js ledger-window.js
          git add ledger-window.js
          git commit -m "ledger-window bundle"
          git push -f origin claude/bundle-out
