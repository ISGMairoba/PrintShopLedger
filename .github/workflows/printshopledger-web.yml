name: PrintShopLedger web
on:
  push:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - run: npm run check:backend
      - id: browser_dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - id: browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-login-sync.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-access-account.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-business-branding.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-checkout.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-materialless-services.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-expenses.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:ui
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-print-settings.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:users-ui
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/check-iphone.mjs
