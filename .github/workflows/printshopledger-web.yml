name: PrintShopLedger web
# TEMPORARY (screenshots): build, run the console check, render the receipt, push images.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-console.mjs
      - if: ${{ always() }}
        run: |
          sudo apt-get install -y poppler-utils >/dev/null
          mkdir -p /tmp/shots
          for f in /tmp/console-receipt-*.pdf; do pdftoppm -png -r 90 "$f" "/tmp/shots/$(basename "$f" .pdf)"; done || true
          cp /tmp/console-subscription-*.png /tmp/console-plans-*.png /tmp/console-trial-*.png /tmp/shots/ || true
          cd /tmp/shots && git init -q && git checkout -q -b ui-shots
          git config user.name ci && git config user.email ci@example.invalid
          git add . && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
