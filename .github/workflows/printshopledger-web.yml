name: PrintShopLedger web
on:
  push:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - run: npm run check:backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node scripts/check-print-settings.mjs
