name: PrintShopLedger web
on:
  push:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/printshopledger-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/run-check.mjs npm run format:check
      - run: node scripts/run-check.mjs npm test
      - run: node scripts/run-check.mjs npm run build

      - run: npm run check:backend
      - id: browser_dependencies
        timeout-minutes: 5
        run: npx playwright install-deps chromium webkit
      - id: browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-job-batches.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-registration.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-dashboard.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-login-sync.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-feedback.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-sale-adjustments.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-remote-review.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-access-account.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-business-branding.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-theme-backgrounds.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-checkout.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-materialless-services.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-expenses.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs npm run test:ui
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-print-settings.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs npm run test:users-ui
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-iphone.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-retail.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-quotations.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: node scripts/run-check.mjs node scripts/check-reminders.mjs
      - if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: |
            /tmp/ledger-dashboard-*.png
            /tmp/ledger-registration-*.png
            /tmp/retail-orders.png
            /tmp/job-batches-*.png
          retention-days: 7

