name: PrintShopLedger web
# TEMPORARY (console-polish branch only): build, run the console check, push screenshots.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-console.mjs
      - if: ${{ always() }}
        run: |
          mkdir -p /tmp/shots && cp /tmp/console-*.png /tmp/shots/ || true
          cd /tmp/shots && git init -q && git checkout -q -b ui-shots
          git config user.name ci && git config user.email ci@example.invalid
          git add . && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
